<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps Calculator</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .container { background: white; padding: 20px; display: inline-block; border-radius: 10px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 10px; margin: 5px; width: 60px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; cursor: pointer; background: #6c5ce7; color: white; border: none; border-radius: 5px; margin: 5px; }
        button:hover { background: #a29bfe; }
        #result { font-size: 24px; margin-top: 20px; color: #2d3436; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DevOps Calculator</h1>
        <input type="number" id="num1" value="0">
        <input type="number" id="num2" value="0">
        <br>
        <button onclick="doCalc('add')">Add (+)</button>
        <button onclick="doCalc('subtract')">Subtract (-)</button>
	<button onclick="doCalc('multiply')">Multiply (*)</button>
        <div id="result">Result: 0</div>
    </div>

    <script src="src/calculator.js"></script>
    <script>
        function doCalc(op) {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const res = (op === 'add') ? calculator.add(n1, n2) : calculator.subtract(n1, n2);
            document.getElementById('result').innerText = "Result: " + res;
        }
    </script>
</body>
</html>
