stages:
  - test
  - quality
  - build
  - deploy

# 1. Run Jest Tests
unit_testing:
  stage: test
  image: node:18
  script:
    - npm install
    - npm test
  artifacts:
    when: always
    reports:
      junit: junit.xml

# 2. SonarCloud Quality Gate
sonarqube_check:
  stage: quality
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  cache:
    key: "${CI_JOB_NAME}"
    paths: [.sonar/cache]
  script: 
    - sonar-scanner -Dsonar.token=$SONAR_TOKEN
  allow_failure: true

# 3. Build Docker Image
docker_build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest

# 4. Deploy to GitLab Pages
pages:
  stage: deploy
  script:
    - mkdir public
    - cp index.html public/
    - mkdir public/src
    - cp src/calculator.js public/src/
  artifacts:
    paths:
      - public
  only:
    - main